<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dürümcü Kemal – Afiyet olsun</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--lavas:#F2DDAE;--kart:#FBF0D6;--sumak:#7A1F2B;--sumak-2:#5B141F;--kor:#E0602F;--murekkep:#2A1A14;--soluk:#6E5546;--cizgi:#D9BC7E}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--lavas);color:var(--murekkep);font-family:Figtree,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px calc(24px + env(safe-area-inset-bottom))}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;flex:1}
.top{text-align:center;padding:8px 0 6px}
.hi{font-size:15px;font-weight:600;color:var(--soluk)}
h1{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:800;font-size:42px;line-height:.95;color:var(--sumak);margin-top:6px}
.sl{font-size:16px;margin-top:12px;line-height:1.45}
.sl b{color:var(--sumak)}
a.opt{display:flex;align-items:center;gap:14px;text-decoration:none;border-radius:22px;padding:18px 18px;color:inherit}
a.opt .ic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px}
a.opt b{display:block;font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-size:22px;font-weight:800;line-height:1.1}
a.opt span.s{font-size:14px;opacity:.85}
a.opt .ar{margin-left:auto;font-size:22px;font-weight:700}
a.opt.rv{color:var(--lavas)}
.rv{background:var(--sumak);color:var(--lavas);box-shadow:0 8px 0 -3px var(--sumak-2)}
.rv .ic{background:var(--lavas)}
.mn{background:var(--kart);border:2px solid var(--cizgi)}
.mn .ic{background:var(--sumak)}
a.opt:focus-visible{outline:3px solid var(--kor);outline-offset:3px}
a.opt:active{transform:translateY(2px)}
.foot{margin-top:auto;text-align:center;font-size:12px;color:var(--soluk);padding-top:18px}
</style>
</head>
<body>
<main>
  <div class="top">
    <p class="hi">Afiyet olsun!</p>
    <h1>Dürümcü Kemal</h1>
    <p class="sl">Acılı Adana'nın ilk lokması seni gülümsettiyse, <b>doğru yerdesin.</b></p>
  </div>

  <a class="opt rv" id="rv" href="https://search.google.com/local/writereview?placeid=ChIJE-7ITj_XuxQRJvsaRCtix68">
    <span class="ic">⭐</span>
    <span><b>Bizi değerlendir</b><span class="s">Google'da birkaç kelime yeter</span></span>
    <span class="ar">›</span>
  </a>

  <a class="opt mn" href="./">
    <span class="ic">🔥</span>
    <span><b>Canlı menümüz</b><span class="s">Ocakta bugün ne var, fiyatlar, alerjenler</span></span>
    <span class="ar">›</span>
  </a>

  <p class="foot">Kemal Usta · Örnekköy, 7401. Sk. No:39/B · menyoo</p>
</main>
</body>
</html>
