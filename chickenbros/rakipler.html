<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chicken Bros – Çevredeki Rakipler</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--lavas:#F2DDAE;--kart:#FBF0D6;--sumak:#7A1F2B;--kor:#E0602F;--murekkep:#2A1A14;--soluk:#6E5546;--cizgi:#D9BC7E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--lavas);color:var(--murekkep);font-family:Figtree,system-ui,sans-serif}
header{padding:14px 16px 10px}
h1{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:24px;color:var(--sumak);line-height:1.1}
header p{font-size:14px;color:var(--soluk);margin-top:4px}
#map{height:58vh;min-height:360px;border-top:2px solid var(--sumak);border-bottom:2px solid var(--sumak)}
.pin{background:#fff;border:2px solid var(--murekkep);border-radius:10px;padding:3px 7px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.35);transform:translate(-50%,-100%);position:absolute;left:0;top:0}
.pin:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--murekkep);border-bottom:0}
.pin small{display:block;font-weight:600;font-size:11px;color:var(--soluk)}
.pin.me{background:var(--sumak);color:#fff;border-color:#fff;font-size:13px}
.pin.me small{color:var(--lavas)}
.pin.me:after{border-top-color:#fff}
.pin.big{border-color:var(--kor)}
.pin.big:after{border-top-color:var(--kor)}
.leaflet-div-icon{background:none;border:0}
.pin.free{transform:translate(-50%,-50%)}
.pin.free:after{display:none}
main{padding:14px 16px 28px;max-width:720px}
.lead{font-size:15px;margin-bottom:12px}
.lead b{color:var(--sumak)}
table{width:100%;border-collapse:collapse;background:var(--kart);border:1.5px solid var(--cizgi);border-radius:14px;overflow:hidden;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px dashed var(--cizgi)}
th{font-size:12px;color:var(--soluk);font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.me td{background:var(--sumak);color:#fff;font-weight:700}
tr:last-child td{border-bottom:0}
.bar{height:6px;border-radius:3px;background:var(--kor);margin-top:4px}
tr.me .bar{background:var(--lavas)}
.src{font-size:12px;color:var(--soluk);margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Chicken Bros ve çevresi</h1>
  <p>Yakındaki tavuk, burger ve fast food işletmeleri · Google puanı ve yorum sayısı</p>
</header>
<div id="map" role="img" aria-label="Uydu haritası üzerinde Chicken Bros ve çevredeki rakipler"></div>
<main>
  <p class="lead" id="lead"></p>
  <table>
    <thead><tr><th>İşletme</th><th class="n">Puan</th><th class="n">Yorum</th><th class="n">Uzaklık</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="src">Puan ve yorum sayıları: Google Haritalar, 8 Ekim 2026 itibarıyla. Uydu görüntüsü: Esri World Imagery. Örnek analiz: infofarer · menyoo</p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ME = {nm:"Chicken Bros", lat:38.4782054, lng:27.1120292, r:5.0, c:35, me:true};
const P = [
  ME,
  {nm:"Chicken Express", lat:38.4773276, lng:27.1099816, r:4.9, c:92, note:"aynı konsept"},
  {nm:"Bi Burger", lat:38.475048, lng:27.114931, r:4.5, c:155},
  {nm:"Paşa Izgara Sandviç", lat:38.4784881, lng:27.1100918, r:5.0, c:15},
  {nm:"Kardo Döner", lat:38.4772056, lng:27.1106433, r:4.1, c:54},
  {nm:"Seyhan Ciğer Kebap", lat:38.475948, lng:27.1151886, r:3.9, c:529},
  {nm:"Yörem Ege", lat:38.4832916, lng:27.1101989, r:4.5, c:328},
  {nm:"Mr.Wings Fried Chicken", lat:38.4639976, lng:27.1148908, r:4.1, c:56, note:"aynı konsept"}
];
function dist(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lng-a.lng)*t;
  const x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(x));}
P.forEach(p=>p.d=dist(ME,p));
const fmtD=m=>m<15?"—":m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1).replace(".",",")+" km";

const map=L.map("map",{zoomControl:true,attributionControl:true}).setView([ME.lat-0.0012,ME.lng-0.0015],16);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:19,attribution:"Uydu: Esri"}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",
  {maxZoom:19,opacity:.55}).addTo(map);
L.circle([ME.lat,ME.lng],{radius:500,color:"#F2DDAE",weight:2,dashArray:"6 6",fill:false}).addTo(map);

/* Yan yana dükkânlar üst üste binmesin: etiketi kaydır, gerçek yeri noktayla göster */
const nudge={"Paşa Izgara Sandviç":[-110,-30],"Kardo Döner":[-90,40],"Chicken Express":[-130,10]};
P.forEach(p=>{
  L.circleMarker([p.lat,p.lng],{radius:p.me?7:5,color:"#fff",weight:2,fillColor:p.me?"#7A1F2B":"#2A1A14",fillOpacity:1}).addTo(map);
  const off=nudge[p.nm];
  const cls=(p.me?"pin me":(p.c>=200?"pin big":"pin"))+(off?" free":"");
  const [dx,dy]=off||[0,-8];
  const html=`<div class="${cls}" style="left:${dx}px;top:${dy}px">${p.nm}<small>★ ${p.r.toFixed(1).replace(".",",")} · ${p.c} yorum</small></div>`;
  L.marker([p.lat,p.lng],{icon:L.divIcon({html,className:"",iconSize:[0,0]}),zIndexOffset:p.me?1000:0,interactive:false}).addTo(map);
});
const b=L.latLngBounds(P.map(p=>[p.lat,p.lng]));
function fit(){map.invalidateSize(); map.fitBounds(b,{padding:[50,50],maxZoom:17});}
fit(); window.addEventListener("load",fit);
let fitted=false; new ResizeObserver(()=>{ if(map.getSize().x>0 && !fitted){ fitted=true; fit(); } }).observe(document.getElementById("map"));

const others=P.filter(p=>!p.me);
const big=others.filter(p=>p.c>=200).length;
const maxC=Math.max(...P.map(p=>p.c));
document.getElementById("lead").innerHTML=`Chicken Bros <b>5,0</b> puanla en yükseklerden, ama <b>35 yorumla</b> geride. 300 metre ötedeki aynı konseptli <b>Chicken Express</b> 92 yorumla Google'da önce çıkıyor.`;
document.getElementById("rows").innerHTML=[...P].sort((a,b)=>b.c-a.c).map(p=>
  `<tr class="${p.me?"me":""}"><td>${p.nm}${p.note?` <small>(${p.note})</small>`:""}<div class="bar" style="width:${Math.max(4,p.c/maxC*100)}%"></div></td>
   <td class="n">★ ${p.r.toFixed(1).replace(".",",")}</td><td class="n">${p.c}</td><td class="n">${fmtD(p.d)}</td></tr>`).join("");
</script>
</body>
</html>
